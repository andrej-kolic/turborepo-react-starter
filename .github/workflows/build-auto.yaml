name: 'Build: Auto'

on:
  push:
    branches: ['main', 'develop']
  pull_request:
    types: [opened, synchronize]

env:
  HUSKY: 0

jobs:
  # One job per build profile (docs/template/build-profiles.md). bare runs every check; features, the build
  # with every optional feature on, runs only the checks that depend on the build: size and env guards.
  # No Sentry DSN from the repo: features has its own fake one, and an empty value would override it.
  build:
    # "Build project" and "Build project (features)" are the names the branch ruleset requires.
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: bare
            name: Build project
            all-checks: 'true'
          - profile: features
            name: Build project (features)
            all-checks: 'false'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      BUILD_PROFILE: ${{ matrix.profile }}
      # To use Remote Caching, uncomment the next lines and follow the steps below.
      # TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      # TURBO_TEAM: ${{ vars.TURBO_TEAM }}

    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Determine build environment
        id: build-env
        run: |
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            BUILD_ENVIRONMENT="staging"
          else
            BUILD_ENVIRONMENT="development"
          fi
          echo "environment=$BUILD_ENVIRONMENT" >> $GITHUB_OUTPUT
          echo "Build environment set to: ${BUILD_ENVIRONMENT}"

      - name: Build project
        uses: ./.github/actions/build-project
        with:
          # build-filter: ${{ vars.DEFAULT_BUNDLER }} # uncomment to enable build filtering based on DEFAULT_BUNDLER variable
          build-environment: ${{ steps.build-env.outputs.environment }}
          check-dependencies: ${{ matrix.all-checks }}
          check-unused: ${{ matrix.all-checks }}
          check-format: ${{ matrix.all-checks }}
          check-type: ${{ matrix.all-checks }}
          run-lint: ${{ matrix.all-checks }}
          run-tests: ${{ matrix.all-checks }}
          check-size: 'true'

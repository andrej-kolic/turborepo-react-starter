packages:
  - apps/*
  - packages/*
  - infra/*

catalog:
  # React ecosystem
  react: 19.3.1
  react-dom: 19.3.1
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0

  # Node
  '@types/node': '24.6.2'

  # Build tools
  vite: 8.3.6
  tsx: '4.23.15'
  serve: 14.2.7
  '@turbo/gen': 2.11.10

  # Browser capture
  playwright-core: 1.65.0

  # Testing
  '@playwright/test': 1.65.0
  vitest: 5.1.0
  jsdom: 31.0.0
  '@testing-library/dom': '10.4.2'
  '@testing-library/jest-dom': '7.0.1'
  '@testing-library/react': 16.3.3
  '@testing-library/user-event': '14.6.8'

engineStrict: true

allowBuilds:
  '@parcel/watcher': true
  '@typescript/native-preview': true
  esbuild: true
  netlify-cli: true
  sharp: true
  tldjs: true
  unix-dgram: false
  unrs-resolver: true

onlyBuiltDependencies:
  - '@parcel/watcher'
  - '@typescript/native-preview'
  - core-js-pure
  - esbuild
  - netlify-cli
  - sharp
  - unrs-resolver

minimumReleaseAgeExclude:
  - '@typescript/native-preview-darwin-arm64@7.0.0-dev.20260527.2'
  - '@typescript/native-preview-darwin-x64@7.0.0-dev.20260527.2'
  - '@typescript/native-preview-linux-arm64@7.0.0-dev.20260527.2'
  - '@typescript/native-preview-linux-arm@7.0.0-dev.20260527.2'
  - '@typescript/native-preview-linux-x64@7.0.0-dev.20260527.2'
  - '@typescript/native-preview-win32-arm64@7.0.0-dev.20260527.2'
  - '@typescript/native-preview-win32-x64@7.0.0-dev.20260527.2'
  - '@typescript/native-preview@7.0.0-dev.20260527.2'
  - rulesync@8.29.0

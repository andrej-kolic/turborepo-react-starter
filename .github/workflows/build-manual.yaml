name: 'Build: Manual'

on:
  workflow_dispatch:
    inputs:
      bundler:
        type: choice
        description: Bundler
        required: false
        default: default
        options:
          - all
          - default
          - app-vite
          - app-rspack
          - app-esbuild
      build_environment:
        type: choice
        description: Build Environment
        required: true
        options:
          - development
          - staging
          - production
      check_dependencies:
        type: boolean
        description: Check dependencies
        default: true
      check_unused:
        type: boolean
        description: Check unused code
        default: true
      check_format:
        type: boolean
        description: Check format
        default: true
      run_lint:
        type: boolean
        description: Run lint
        default: true
      run_tests:
        type: boolean
        description: Run tests
        default: true
      check_size:
        type: boolean
        description: Check bundle size
        default: true

env:
  HUSKY: 0

jobs:
  # One job per build profile (docs/template/build-profiles.md). bare runs every check; features, the build
  # with every optional feature on, runs only the checks that depend on the build: size and env guards.
  # No Sentry DSN from the repo: features has its own fake one, and an empty value would override it.
  build:
    # "Build project" and "Build project (features)" are the names the branch ruleset requires.
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: bare
            name: Build project
            all-checks: 'true'
          - profile: features
            name: Build project (features)
            all-checks: 'false'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      BUILD_PROFILE: ${{ matrix.profile }}
      # To use Remote Caching, uncomment the next lines and follow the steps below.
      # TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      # TURBO_TEAM: ${{ vars.TURBO_TEAM }}

    steps:
      - name: Set BUNDLER environment variable
        id: set-bundler
        run: |
          if [ "${{ github.event.inputs.bundler }}" == "all" ]; then
            echo "bundler=" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.inputs.bundler }}" == "default" ]; then
            echo "bundler=${{ vars.DEFAULT_BUNDLER }}" >> $GITHUB_OUTPUT
          elif [ -n "${{ github.event.inputs.bundler }}" ]; then
            echo "bundler=${{ github.event.inputs.bundler }}" >> $GITHUB_OUTPUT
          else
            echo "bundler=${{ vars.DEFAULT_BUNDLER }}" >> $GITHUB_OUTPUT
          fi

      - name: Check DEFAULT_BUNDLER
        if: ${{ !vars.DEFAULT_BUNDLER }}
        run: |
          echo "::warning::DEFAULT_BUNDLER variable is not set."

      - name: Check out code
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Build project
        uses: ./.github/actions/build-project
        with:
          build-filter: ${{ steps.set-bundler.outputs.bundler }}
          build-environment: ${{ github.event.inputs.build_environment }}
          check-dependencies: ${{ matrix.all-checks == 'true' && github.event.inputs.check_dependencies || 'false' }}
          check-unused: ${{ matrix.all-checks == 'true' && github.event.inputs.check_unused || 'false' }}
          check-format: ${{ matrix.all-checks == 'true' && github.event.inputs.check_format || 'false' }}
          check-type: ${{ matrix.all-checks }}
          run-lint: ${{ matrix.all-checks == 'true' && github.event.inputs.run_lint || 'false' }}
          run-tests: ${{ matrix.all-checks == 'true' && github.event.inputs.run_tests || 'false' }}
          check-size: ${{ github.event.inputs.check_size }}

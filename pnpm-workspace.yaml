packages:
  - apps/*
  - packages/*
  - infra/*

# What goes in the catalog: AGENTS.md "Monorepo conventions".
catalog:
  # React ecosystem
  react: 19.3.1
  react-dom: 19.3.1
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0

  # Node
  '@types/node': '26.6.6'

  # Build tools
  vite: 8.3.8
  browserslist-to-esbuild: 2.1.1
  tsx: '4.23.15'
  serve: 14.2.8
  '@turbo/gen': 2.11.13
  # turbo: only the root uses it, but `turbo gen` runs @turbo/gen at turbo's
  # own version, so the installed @turbo/gen types must match it.
  turbo: 2.11.13

  # Lint
  oxlint: 1.94.0

  # Bundle size
  size-limit: 14.3.0
  '@size-limit/file': 14.3.0

  # Validation
  zod: 4.6.7

  # State and API mocking (@repo/core, @repo/web)
  zustand: 5.1.0
  msw: 3.0.7

  # Browser capture
  playwright-core: 1.65.1

  # Testing
  # @playwright/test: only e2e uses it, but it must match playwright-core, and CI reads the
  # Playwright container version from here (verify-build.yml, verify-dev.yml).
  '@playwright/test': 1.65.1
  vitest: 5.1.1
  jsdom: 31.0.1
  '@testing-library/dom': '10.4.2'
  '@testing-library/jest-dom': '8.0.0'
  '@testing-library/react': 16.3.3

engineStrict: true

allowBuilds:
  '@parcel/watcher': true
  '@sentry/cli': true
  esbuild: true
  netlify-cli: true
  sharp: true
  tldjs: true
  unix-dgram: false
  unrs-resolver: true

onlyBuiltDependencies:
  - '@parcel/watcher'
  - core-js-pure
  - esbuild
  - netlify-cli
  - sharp
  - unrs-resolver

overrides:
  # serve 14.2.7 (latest) pins compression 1.8.1, which has a high-severity advisory
  'serve>compression': 1.8.2

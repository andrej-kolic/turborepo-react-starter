name: 'Deploy: GitHub Pages: UI'

on:
  workflow_dispatch:
    inputs:
      documentation:
        type: boolean
        description: Documentation only
        required: true

permissions:
  contents: read
  pages: write
  id-token: write

env:
  HUSKY: 0
  STORYBOOK_OPTIONS: ${{ inputs.documentation && '--docs' || '' }}

jobs:
  publish:
    # name: Build and Publish Storybook

    environment:
      name: github-pages
      url: ${{ steps.publish-storybook.outputs.page_url }}

    timeout-minutes: 15
    runs-on: ubuntu-latest

    # To use Remote Caching, uncomment the next lines and follow the steps below.
    # env:
    #  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
    #  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Setup
        uses: ./.github/actions/setup

      - name: Check dependencies
        run: pnpm check:dependencies

      - name: Build Storybook
        run: pnpm build:ui

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Storybook
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/ui-storybook/storybook-static

      - id: publish-storybook
        name: Publish Storybook
        uses: actions/deploy-pages@v5

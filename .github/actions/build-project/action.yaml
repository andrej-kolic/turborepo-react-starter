name: 'Build Project'
description: "Checks the code, builds one app, then checks the build's size and env guards"

inputs:
  run-build:
    description: "Build the project and check the build; 'false' skips both and runs only the code checks"
    required: false
    default: 'true'

  check-dependencies:
    description: 'Run dependency check (pnpm check:dependencies)'
    required: false
    default: 'true'

  check-unused:
    description: 'Run unused code check (pnpm check:unused)'
    required: false
    default: 'true'

  check-format:
    description: 'Run format check (pnpm check:format)'
    required: false
    default: 'true'

  check-route-tree:
    description: 'Fail when the committed app-core route tree (routeTree.gen.ts) differs from a fresh generate'
    required: false
    default: 'true'

  run-lint:
    description: 'Run linting (pnpm lint)'
    required: false
    default: 'true'

  run-tests:
    description: 'Run tests (pnpm test)'
    required: false
    default: 'true'

  check-type:
    description: 'Run type check (pnpm check:type)'
    required: false
    default: 'true'

  check-size:
    description: "Run bundle size check (pnpm check:size); needs run-build 'true'"
    required: false
    default: 'true'

  build-filter:
    description: 'Build filter for specific packages/apps (e.g., app-vite)'
    required: false

  build-environment:
    description: 'Build environment (development, staging, production)'
    required: true

runs:
  using: 'composite'

  steps:
    - name: Log input
      shell: bash
      run: |
        echo "Run build: ${{ inputs.run-build }}"
        echo "Check dependencies: ${{ inputs.check-dependencies }}"
        echo "Check unused: ${{ inputs.check-unused }}"
        echo "Check format: ${{ inputs.check-format }}"
        echo "Check route tree: ${{ inputs.check-route-tree }}"
        echo "Run lint: ${{ inputs.run-lint }}"
        echo "Run tests: ${{ inputs.run-tests }}"
        echo "Check type: ${{ inputs.check-type }}"
        echo "Check size: ${{ inputs.check-size }}"
        echo "Build filter: ${{ inputs.build-filter }}"
        echo "Build environment: ${{ inputs.build-environment }}"
        echo "Build profile: ${BUILD_PROFILE:-none}"

    - name: Setup
      uses: ./.github/actions/setup

    - name: Check dependencies
      if: inputs.check-dependencies == 'true'
      shell: bash
      run: BUILD_ENVIRONMENT=${{ inputs.build-environment }} pnpm check:dependencies

    - name: Check unused
      if: inputs.check-unused == 'true'
      shell: bash
      # knip loads packages/e2e/playwright.config.ts, which needs BUNDLER set; any bundler works.
      run: BUILD_ENVIRONMENT=${{ inputs.build-environment }} BUNDLER=app-vite pnpm check:unused

    - name: Check format
      if: inputs.check-format == 'true'
      shell: bash
      run: BUILD_ENVIRONMENT=${{ inputs.build-environment }} pnpm check:format

    - name: Check route tree
      if: inputs.check-route-tree == 'true'
      shell: bash
      run: |
        pnpm --filter @repo/app-core generate:routes
        git diff --exit-code packages/app-core/src/routeTree.gen.ts

    - name: Build and run quality checks
      shell: bash
      run: |
        TASKS=""

        # The build and the checks that run on it: env guards always, size when asked.
        if [ "${{ inputs.run-build }}" = "true" ]; then
          TASKS="build check:env-guards"
          if [ "${{ inputs.check-size }}" = "true" ]; then
            TASKS="$TASKS check:size"
          fi
        fi

        if [ "${{ inputs.check-type }}" = "true" ]; then
          TASKS="$TASKS check:type"
        fi

        if [ "${{ inputs.run-lint }}" = "true" ]; then
          TASKS="$TASKS lint"
        fi

        if [ "${{ inputs.run-tests }}" = "true" ]; then
          TASKS="$TASKS test"
        fi

        if [ -z "$TASKS" ]; then
          echo "No Turbo tasks to run."
          exit 0
        fi

        echo "Running tasks in parallel: $TASKS"

        FILTER=""
        if [ -n "${{ inputs.build-filter }}" ]; then
          FILTER="--filter ${{ inputs.build-filter }}..."
        else
          echo "No build filter provided, running tasks ($TASKS) across the entire monorepo."
        fi

        BUILD_ENVIRONMENT=${{ inputs.build-environment }} pnpm turbo $TASKS $FILTER

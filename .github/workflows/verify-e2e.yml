# Playwright E2E gate — regression on production preview.
# `pnpm e2e` builds the app with BUILD_PROFILE, serves its preview and runs @repo/e2e against it.
#
# Single bundler (DEFAULT_BUNDLER, fallback app-vite). Multi-bundler boot stays in verify-browser-smoke.yml.
#
# One job per build profile (docs/template/build-profiles.md), running in parallel:
#   bare      no optional features, as a fork ships it  -> every test except those tagged @features
#   features  every optional feature on, fake values    -> every test
# A new test or optional feature needs no new job.

name: 'Verify: E2E'

on:
  pull_request:
  workflow_dispatch:

env:
  HUSKY: 0
  BUILD_ENVIRONMENT: development
  BUNDLER: ${{ vars.DEFAULT_BUNDLER || 'app-vite' }}

jobs:
  playwright-version:
    name: Resolve Playwright version
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read @playwright/test from the pnpm catalog
        id: version
        run: |
          version="$(yq -r '.catalog["@playwright/test"] // ""' pnpm-workspace.yaml)"
          test -n "$version" || { echo "No @playwright/test version in the pnpm-workspace.yaml catalog"; exit 1; }
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  e2e:
    name: Playwright E2E (${{ vars.DEFAULT_BUNDLER || 'app-vite' }}, ${{ matrix.profile }})
    needs: playwright-version
    strategy:
      fail-fast: false
      matrix:
        profile: [bare, features]
    timeout-minutes: 20
    runs-on: ubuntu-latest
    # Browsers and their system libraries come with the image, so CI needs no apt mirror.
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.version }}-noble
      options: --user 1001
    defaults:
      run:
        shell: bash
    env:
      BUILD_PROFILE: ${{ matrix.profile }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js (with pnpm cache)
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Playwright builds the app and starts its preview first (webServer in packages/e2e/playwright.config.ts).
      - name: Run E2E tests
        run: pnpm e2e

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failure-${{ matrix.profile }}-${{ github.run_id }}
          path: |
            packages/e2e/test-results/**
            packages/e2e/playwright-report/**
          retention-days: 30
          if-no-files-found: ignore

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## Playwright E2E — ${BUNDLER}, ${BUILD_PROFILE}"
            echo ""
            echo "| Item | Value |"
            echo "|------|-------|"
            echo "| Bundler | ${BUNDLER} |"
            echo "| Build profile | ${BUILD_PROFILE} |"
          } >> "$GITHUB_STEP_SUMMARY"

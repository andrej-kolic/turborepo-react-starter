name: 'Capture: Browser trace'

# Records a browser trace: comment /capture-trace on a PR to trace its code, or run it by hand on a branch.
# The PR's code runs with read-only access and no secrets; a separate job posts the result comment.
on:
  workflow_dispatch:
    inputs:
      url:
        description: 'App URL to trace (defaults to local dev app)'
        required: false
  issue_comment:
    types: [created]

permissions: {}

jobs:
  # ─── Main capture job ────────────────────────────────────────────────────────
  capture:
    name: Capture browser trace artifacts
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      HUSKY: 0
      BUILD_ENVIRONMENT: development
      CHROME_HEADLESS: 'true'
      CHROME_DEBUG_PORT: 9222
      BUNDLER: ${{ vars.DEFAULT_BUNDLER || 'app-vite' }}

    # Only on manual dispatch, or when the owner, a member or a collaborator comments /capture-trace on a PR.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.issue.pull_request &&
        contains(github.event.comment.body, '/capture-trace') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
      )

    # Read by the comment job through env only: the PR's code can shape them.
    outputs:
      capture_duration_ms: ${{ steps.capture.outputs.capture_duration_ms }}
      target_url: ${{ steps.capture.outputs.target_url }}
      artifact_size_bytes: ${{ steps.artifact-size.outputs.artifact_size_bytes }}

    steps:
      # ── Checkout ─────────────────────────────────────────────────────────────
      # The PR's head commit as it is when the job starts; a push after the comment is traced instead.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'issue_comment' && format('refs/pull/{0}/head', github.event.issue.number) || '' }}
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Resolve trace URL
        id: trace-url
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_URL: ${{ inputs.url }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          URL=""
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$INPUT_URL" ]; then
            URL="$INPUT_URL"
          elif [ "$EVENT_NAME" = "issue_comment" ] && [ -n "$COMMENT_BODY" ]; then
            URL=$(printf '%s\n' "$COMMENT_BODY" | grep -oE 'https?://[^[:space:>)]+' | head -1 || true)
          fi
          echo "url=${URL}" >> "$GITHUB_OUTPUT"
          if [ -n "$URL" ]; then
            echo "Trace target: ${URL}"
          else
            echo "Trace target: local dev app"
          fi

      - name: Ensure dev app is running
        if: steps.trace-url.outputs.url == ''
        run: pnpm browser:ensure-app -- --log-file /tmp/dev-app.log

      - name: Setup Chrome (headless)
        env:
          TRACE_URL: ${{ steps.trace-url.outputs.url }}
        run: |
          if [ -n "$TRACE_URL" ]; then
            pnpm browser:setup -- --url "$TRACE_URL"
          else
            pnpm browser:setup
          fi

      - name: Record trace
        id: capture
        env:
          TRACE_URL: ${{ steps.trace-url.outputs.url }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          CAPTURE_START_MS=$(date +%s%3N)
          if [ -n "$TRACE_URL" ]; then
            TARGET_URL="$TRACE_URL"
          else
            TARGET_URL=$(pnpm exec dev-tools-app-target url)
          fi
          pnpm capture record-trace "$TARGET_URL" --duration 5
          CAPTURE_END_MS=$(date +%s%3N)
          DURATION_MS=$((CAPTURE_END_MS - CAPTURE_START_MS))
          echo "Trace recorded in ${DURATION_MS}ms (${TARGET_URL})"
          echo "capture_duration_ms=${DURATION_MS}" >> "$GITHUB_OUTPUT"
          echo "target_url=${TARGET_URL}" >> "$GITHUB_OUTPUT"

      # ── Upload artifacts ──────────────────────────────────────────────────────
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: devtools-artifacts-${{ github.run_attempt }}
          path: packages/browser-capture/artifacts/**
          retention-days: 30
          if-no-files-found: ignore

      # ── Measure artifact size ─────────────────────────────────────────────────
      - name: Compute artifact size
        id: artifact-size
        run: |
          SIZE_BYTES=$(du -sb packages/browser-capture/artifacts/ | cut -f1)
          echo "Artifact directory size: ${SIZE_BYTES} bytes"
          echo "artifact_size_bytes=${SIZE_BYTES}" >> "$GITHUB_OUTPUT"

      - name: Cleanup
        if: always()
        run: |
          pnpm chrome:debug --stop || true
          if APP_PORT=$(pnpm exec dev-tools-app-target port); then
            lsof -ti:"$APP_PORT" | xargs -r kill 2>/dev/null || true
          fi

      # ── Job Summary (ops metrics) ─────────────────────────────────────────────
      - name: Write ops summary
        if: always()
        env:
          CAPTURE: ${{ steps.capture.outputs.capture_duration_ms }}
          TRACE_URL: ${{ steps.capture.outputs.target_url }}
          SIZE: ${{ steps.artifact-size.outputs.artifact_size_bytes }}
          ACTOR: ${{ github.actor }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          # Human-readable size
          if [ -n "$SIZE" ] && [ "$SIZE" -gt 0 ] 2>/dev/null; then
            SIZE_KB=$(echo "scale=1; $SIZE / 1024" | bc)
            SIZE_HUMAN="${SIZE_KB} KB"
          else
            SIZE_HUMAN="n/a"
          fi

          cat >> "$GITHUB_STEP_SUMMARY" << EOF
          ## 🔍 Browser trace capture — Ops Report

          | Metric | Value |
          |--------|-------|
          | Run ID | [\`${GITHUB_RUN_ID}\`](${RUN_URL}) |
          | Actor | \`${ACTOR}\` |
          | Trigger | \`${EVENT_NAME}\` |
          | Branch | \`${REF_NAME}\` |
          | Trace URL | ${TRACE_URL:-local dev app} |
          | Capture duration | ${CAPTURE:-n/a} ms |
          | Artifact size | ${SIZE_HUMAN} (${SIZE:-n/a} bytes) |
          | Retention | 30 days |

          Artifacts: [Download from run page](${RUN_URL})
          EOF

  # ─── PR comment job ──────────────────────────────────────────────────────────
  # Never checks out the PR; reads the capture results only through env.
  comment:
    name: Comment on PR
    needs: capture
    # A cancelled capture gets no comment: it did not fail.
    if: always() && github.event_name == 'issue_comment' && needs.capture.result != 'skipped' && needs.capture.result != 'cancelled'
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write

    steps:
      - name: Comment on PR with run link
        uses: actions/github-script@v9
        env:
          CAPTURE_RESULT: ${{ needs.capture.result }}
          CAPTURE_DURATION_MS: ${{ needs.capture.outputs.capture_duration_ms }}
          TRACE_URL: ${{ needs.capture.outputs.target_url }}
          ARTIFACT_SIZE_BYTES: ${{ needs.capture.outputs.artifact_size_bytes }}
        with:
          script: |
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const body =
              process.env.CAPTURE_RESULT === 'success'
                ? [
                    '## ✅ Browser trace capture complete',
                    '',
                    '| Metric | Value |',
                    '|--------|-------|',
                    `| Trace URL | ${process.env.TRACE_URL || 'local dev app'} |`,
                    `| Capture duration | ${process.env.CAPTURE_DURATION_MS || 'n/a'} ms |`,
                    `| Artifact size | ${process.env.ARTIFACT_SIZE_BYTES ? (Number(process.env.ARTIFACT_SIZE_BYTES) / 1024).toFixed(1) + ' KB' : 'n/a'} |`,
                    `| Retention | 30 days |`,
                    '',
                    `Artifacts are attached to this workflow run: ${runUrl}`,
                    '',
                    'Files: `metadata.json`, `har.json`, `trace.zip`, `console.json`, `performance.json`',
                    'View trace locally: `npx playwright show-trace trace-*/trace.zip`',
                  ].join('\n')
                : `## ❌ Browser trace capture failed\n\nThe capture job encountered an error. Check the [run logs](${runUrl}) for details.\n\n**Run ID:** \`${process.env.GITHUB_RUN_ID}\``;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body,
            });

  # ─── Failure alert job ───────────────────────────────────────────────────────
  alert-on-failure:
    name: Alert on capture failure
    runs-on: ubuntu-latest
    needs: capture
    if: failure()

    steps:
      - name: Post failure summary
        uses: actions/github-script@v9
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
        with:
          script: |
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            await core.summary
              .addHeading('❌ Browser trace capture failed')
              .addRaw(`The \`capture-browser-trace.yml\` capture job failed for run [\`${process.env.GITHUB_RUN_ID}\`](${runUrl}).`)
              .addBreak()
              .addRaw(`**Trigger:** \`${process.env.EVENT_NAME}\` | **Actor:** \`${process.env.ACTOR}\``)
              .addBreak()
              .addRaw(`Check the [run logs](${runUrl}) for details.`)
              .write();

name: 'Deploy: AWS: Content'

on:
  # schedule:
  #   - cron: '*/2 * * * *'
  #   # - cron: '10 15 11 7 *'

  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
    types: [opened]

  workflow_dispatch:
    inputs:
      bundler:
        type: choice
        description: Bundler
        required: true
        default: default
        options:
          - default
          - web-vite
          - web-rspack
          - web-esbuild
      environment:
        description: 'Deployment environment'
        required: true
        default: development
        type: choice
        options:
          - development
          - staging
          - production

concurrency:
  # Unique group for each workflow + branch + environment + content action
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.inputs.environment }}-content
  cancel-in-progress: true # Cancel any in-progress runs for this group

env:
  # Sentry's DSN: unset or empty builds without error reporting (docs/template/error-reporting.md).
  APP_REACT_SENTRY_DSN: ${{ vars.APP_REACT_SENTRY_DSN }}
  # The todo API's base URL: unset or empty serves the mocked API in the browser (docs/template/env.md).
  APP_REACT_API_URL: ${{ vars.APP_REACT_API_URL }}
  AWS_DEFAULT_REGION: us-east-1
  HUSKY: 0
  BUNDLER: >-
    ${{
      (github.event.inputs.bundler == 'default' && vars.DEFAULT_BUNDLER)
      || github.event.inputs.bundler
      || vars.DEFAULT_BUNDLER
    }}

permissions:
  id-token: write
  contents: write
  issues: write
  pull-requests: write

jobs:
  # Picks the environment from the event: a push to develop or a PR from develop deploys development,
  # a push to main deploys staging, a manual run deploys the chosen one. A PR into main from any other
  # branch deploys nothing.
  deploy:
    name: Deploy (${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.ref == 'refs/heads/main' && 'staging' || 'development' }})
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')) ||
      (github.event_name == 'pull_request' && github.head_ref == 'develop') ||
      github.event_name == 'workflow_dispatch'
    environment: &deploy-environment ${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.ref == 'refs/heads/main' && 'staging' || 'development' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build project
        uses: ./.github/actions/build-project
        with:
          build-filter: ${{ env.BUNDLER }}
          build-environment: *deploy-environment
          check-dependencies: 'false'
          check-unused: 'false'
          check-format: 'false'
          check-route-tree: 'false'
          run-lint: 'false'
          run-tests: 'false'
          check-size: 'false'

      - name: Deploy
        uses: ./infra/aws/.github/actions/deploy
        # Source map upload (docs/template/error-reporting.md); unset skips it.
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        with:
          environment: *deploy-environment
          action: content
          aws-role-arn: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}
          comment-pr: ${{ github.event_name == 'pull_request' }}
          create-release: ${{ github.event_name == 'workflow_dispatch' && inputs.environment == 'production' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

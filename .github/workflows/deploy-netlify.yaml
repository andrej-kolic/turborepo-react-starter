name: 'Deploy: Netlify'

on:
  workflow_dispatch:
    inputs:
      bundler:
        type: choice
        description: Bundler
        required: true
        default: default
        options:
          - default
          - app-vite
          - app-rspack
          - app-esbuild

      environment:
        type: choice
        description: Environment
        required: true
        options:
          - production
          - staging

env:
  HUSKY: 0
  # Sentry's DSN: unset or empty builds without error reporting (docs/template/error-reporting.md).
  APP_REACT_SENTRY_DSN: ${{ vars.APP_REACT_SENTRY_DSN }}
  # SELECTED_ENVIRONMENT: ${{ github.ref_name }}
  BRANCH_NAME: ${{ github.ref_name }}
  BUILD_ENVIRONMENT: ${{ github.event.inputs.environment }}
  NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
  NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
  BUNDLER: >-
    ${{
      (github.event.inputs.bundler == 'default' && vars.DEFAULT_BUNDLER)
      || github.event.inputs.bundler
      || vars.DEFAULT_BUNDLER
    }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Log environment
        run: echo "Environment=${{ github.event.inputs.environment }}, Bundler=${{env.BUNDLER}}, BRANCH_NAME=${{ env.BRANCH_NAME }}"

      - name: Check out code
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      # Builds and checks env guards before the deploy; the code checks already ran on the PR.
      - name: Build project
        uses: ./.github/actions/build-project
        with:
          build-filter: ${{ env.BUNDLER }}
          build-environment: ${{ env.BUILD_ENVIRONMENT }}
          check-dependencies: 'false'
          check-unused: 'false'
          check-format: 'false'
          check-type: 'false'
          run-lint: 'false'
          run-tests: 'false'
          check-size: 'false'

      - name: Log Build output
        run: ls apps/${{ env.BUNDLER }}/dist

      - name: Deploy to Netlify
        id: netlify_deploy
        run: pnpm run --filter @repo/infra-netlify deploy:ci
        # Source map upload (docs/template/error-reporting.md); unset skips it.
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        # NOTE: output saved in a file we can read (deploy_output.json), in this format:
        # {
        #   "site_name": "turborepo-react-starter",
        #   "deploy_id": "672197a700d5efd972e83103",
        #   "deploy_url": "https://672197a700d5efd972e83103--turborepo-react-starter.netlify.app",
        #   "logs": "https://app.netlify.com/sites/turborepo-react-starter/deploys/672197a700d5efd972e83103",
        #   "url": "https://turborepo-react-starter.netlify.app"
        # }

      - name: Generate URLs
        id: generate_urls
        run: |
          cd infra/netlify
          jq . deploy_output.json
          NETLIFY_DEPLOY_URL=$(jq -r '.deploy_url' deploy_output.json)
          echo "NETLIFY_DEPLOY_URL=$NETLIFY_DEPLOY_URL" >> "$GITHUB_OUTPUT"
          NETLIFY_URL=$(jq -r '.url' deploy_output.json)
          echo "NETLIFY_URL=$NETLIFY_URL" >> "$GITHUB_OUTPUT"

      - name: Log URLs
        run: |
          echo NETLIFY_DEPLOY_URL:${{ steps.generate_urls.outputs.NETLIFY_DEPLOY_URL }}
          echo NETLIFY_URL:${{ steps.generate_urls.outputs.NETLIFY_URL }}

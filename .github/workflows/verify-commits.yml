name: 'Verify: Commits'

# Catches commits that skipped the local commit-msg hook
# (`--no-verify`, GitHub web editor, direct pushes).
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  # PR branches are already checked by pull_request.
  push:
    branches: [develop, main]

permissions:
  contents: read

env:
  HUSKY: 0

jobs:
  commitlint:
    name: Lint commit messages
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Every commit in the PR, or every commit in the push.
      - name: Lint commit messages
        env:
          FROM: ${{ github.event.pull_request.base.sha || github.event.before }}
          TO: ${{ github.event.pull_request.head.sha || github.event.after }}
        run: |
          if git cat-file -e "$FROM^{commit}" 2>/dev/null; then
            pnpm exec commitlint --verbose --from "$FROM" --to "$TO"
          else
            # Branch created or force-pushed: the old tip is gone.
            pnpm exec commitlint --verbose --last
          fi

      # A squash merge of several commits uses the PR title as the message.
      - name: Lint PR title
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$TITLE" | pnpm exec commitlint --verbose

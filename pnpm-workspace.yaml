packages:
  - apps/*
  - packages/*
  - infra/*

catalog:
  # React ecosystem
  react: 19.3.1
  react-dom: 19.3.1
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  react-error-boundary: 6.1.6

  # Node
  '@types/node': '26.6.6'

  # Build tools
  vite: 8.3.8
  browserslist-to-esbuild: 2.1.1
  tsx: '4.23.15'
  serve: 14.2.7
  '@turbo/gen': 2.11.11

  # Bundle size
  size-limit: 14.3.0
  '@size-limit/file': 14.3.0

  # Validation
  zod: 4.6.7

  # Browser capture
  playwright-core: 1.65.0

  # Testing
  '@playwright/test': 1.65.0
  vitest: 5.1.0
  jsdom: 31.0.0
  '@testing-library/dom': '10.4.2'
  '@testing-library/jest-dom': '7.0.1'
  '@testing-library/react': 16.3.3

engineStrict: true

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  netlify-cli: true
  sharp: true
  tldjs: true
  unix-dgram: false
  unrs-resolver: true

onlyBuiltDependencies:
  - '@parcel/watcher'
  - core-js-pure
  - esbuild
  - netlify-cli
  - sharp
  - unrs-resolver

minimumReleaseAgeExclude:
  - rulesync@8.29.0

overrides:
  # serve 14.2.7 (latest) pins compression 1.8.1, which has a high-severity advisory
  'serve>compression': 1.8.2
